<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novo cliente</title>
<style>
:root{--tinta:#1d1d1f;--suave:#6e6e73;--linha:#d2d2d7;--azul:#0071e3;--erro:#b3261e;--ok:#1a7f37}
*{box-sizing:border-box}
body{margin:0;background:#f5f5f7;color:var(--tinta);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;padding:48px 20px 80px}
h1{font-size:34px;line-height:1.1;letter-spacing:-.015em;margin:0 0 6px;font-weight:600}
.sub{color:var(--suave);margin:0 0 28px}
.cartao{background:#fff;border-radius:18px;padding:26px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
label{display:block;font-size:13px;color:var(--suave);margin:16px 0 6px}
input{width:100%;height:46px;padding:0 14px;border:1px solid var(--linha);border-radius:10px;font:inherit;color:inherit;background:#fff}
input:focus{outline:2px solid var(--azul);outline-offset:1px;border-color:transparent}
input.veio{background:#f0f7ff}
.linha{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.linha.tres{grid-template-columns:2fr 1fr 80px}
.busca{display:flex;gap:10px}
.busca input{flex:1}
button{height:46px;padding:0 20px;border:0;border-radius:10px;background:var(--azul);color:#fff;font:inherit;font-weight:500;cursor:pointer}
button.claro{background:#fff;color:var(--tinta);border:1px solid var(--linha)}
button:disabled{opacity:.55}
#aviso{min-height:22px;margin:10px 0 0;font-size:14px;color:var(--suave)}
#aviso.erro{color:var(--erro)}#aviso.ok{color:var(--ok)}
ul{list-style:none;margin:10px 0 0;padding:0;border:1px solid var(--linha);border-radius:10px;overflow:hidden}
ul:empty{display:none}
li{padding:10px 14px;cursor:pointer}li+li{border-top:1px solid var(--linha)}li:hover{background:#f5f5f7}
li small{display:block;color:var(--suave)}
.fim{display:flex;gap:10px;margin-top:24px}
h2{font-size:20px;margin:36px 0 10px;font-weight:600}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;font-size:14px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid #eee}th{color:var(--suave);font-weight:500}
@media (max-width:560px){.linha,.linha.tres{grid-template-columns:1fr}.busca{flex-direction:column}button{width:100%}.fim{flex-direction:column}}
</style>
</head>
<body>
<main>
  <h1>Novo cliente</h1>
  <p class="sub">Digite o CNPJ ou o nome da empresa. O resto do cadastro se preenche.</p>
  <div class="cartao">
    <label for="q">CNPJ ou nome da empresa</label>
    <div class="busca"><input id="q" autocomplete="off" inputmode="search" placeholder="37.853.407/0001-71 ou o nome"><button id="buscar" type="button">Buscar</button></div>
    <p id="aviso" aria-live="polite"></p>
    <ul id="lista"></ul>
    <form id="f">
      <label for="razao">Razão social</label><input id="razao" name="razao">
      <div class="linha">
        <div><label for="fantasia">Nome fantasia</label><input id="fantasia" name="fantasia"></div>
        <div><label for="cnpj">CNPJ</label><input id="cnpj" name="cnpj" readonly></div>
      </div>
      <div class="linha">
        <div><label for="situacao">Situação na Receita</label><input id="situacao" name="situacao" readonly></div>
        <div><label for="atividade">Atividade principal</label><input id="atividade" name="atividade"></div>
      </div>
      <label for="endereco">Endereço</label><input id="endereco" name="endereco">
      <div class="linha tres">
        <div><label for="cidade">Cidade</label><input id="cidade" name="cidade"></div>
        <div><label for="cep">CEP</label><input id="cep" name="cep"></div>
        <div><label for="uf">UF</label><input id="uf" name="uf" maxlength="2"></div>
      </div>
      <div class="linha">
        <div><label for="telefone">Telefone</label><input id="telefone" name="telefone"></div>
        <div><label for="email">E-mail</label><input id="email" name="email" type="email"></div>
      </div>
      <div class="fim"><button type="submit">Salvar cliente</button><button class="claro" type="reset">Limpar</button></div>
    </form>
  </div>
  <h2>Clientes desta sessão</h2>
  <table><thead><tr><th>Empresa</th><th>CNPJ</th><th>Cidade</th></tr></thead><tbody id="clientes"></tbody></table>
</main>
<script>
(function(){
  var $=function(i){return document.getElementById(i)},aviso=$('aviso'),lista=$('lista'),f=$('f');
  function dizer(t,c){aviso.textContent=t;aviso.className=c||''}
  function por(id,v){var e=$(id);e.value=v==null?'':v;e.classList.toggle('veio',!!v)}
  function formatar(c){return c.length===14?c.slice(0,2)+'.'+c.slice(2,5)+'.'+c.slice(5,8)+'/'+c.slice(8,12)+'-'+c.slice(12):c}
  function preencher(e){
    var n=e.endereco||{};
    por('razao',e.razao_social);por('fantasia',e.nome_fantasia);por('cnpj',e.cnpj_formatado||formatar(e.cnpj));
    por('situacao',e.situacao.descricao+(e.situacao.desde?' desde '+e.situacao.desde.split('-').reverse().join('/'):''));
    por('atividade',e.cnae_principal&&e.cnae_principal.descricao);
    por('endereco',[[n.tipo_logradouro,n.logradouro].filter(Boolean).join(' '),n.numero,n.complemento&&n.complemento.replace(/\s+/g,' ').trim(),n.bairro].filter(Boolean).join(', '));
    por('cidade',n.cidade);por('cep',n.cep);por('uf',n.uf);por('telefone',e.telefone);por('email',e.email);
    dizer(e.situacao.descricao==='Ativa'?'Empresa ativa na Receita. Confira e salve.':'Atenção: situação "'+e.situacao.descricao+'" na Receita.',e.situacao.descricao==='Ativa'?'ok':'erro');
  }
  function pedir(u){return fetch(u).then(function(r){return r.json().then(function(j){return{ok:r.ok,status:r.status,espere:r.headers.get('retry-after'),j:j}})})}
  function falhou(x){dizer(x.status===429?'Muitas consultas agora. Tente de novo em '+(x.espere||60)+' segundos.':(x.j.erro&&x.j.erro.mensagem)||'Não consegui consultar agora.','erro')}
  function porCnpj(c){
    dizer('Consultando…');lista.textContent='';
    pedir('/api/empresa/'+encodeURIComponent(c)).then(function(x){if(x.ok)preencher(x.j);else falhou(x)}).catch(function(){dizer('Sem conexão com o servidor.','erro')});
  }
  function buscar(){
    var v=$('q').value.trim();if(!v)return;
    var limpo=v.replace(/[.\/\-\s]/g,'');
    if(/^[0-9A-Za-z]{12}[0-9]{2}$/.test(limpo)&&/[0-9]/.test(limpo))return porCnpj(limpo);
    if(v.replace(/\s/g,'').length<4)return dizer('Digite pelo menos 4 letras do nome.','erro');
    dizer('Procurando…');lista.textContent='';
    pedir('/api/empresas?nome='+encodeURIComponent(v)).then(function(x){
      if(!x.ok)return falhou(x);
      if(!x.j.empresas.length)return dizer('Nenhuma empresa ativa com esse nome.','erro');
      dizer(x.j.empresas.length+' empresas. Escolha uma.');
      x.j.empresas.forEach(function(e){
        var li=document.createElement('li'),s=document.createElement('small');
        li.textContent=e.nome_fantasia||e.razao_social;s.textContent=e.cnpj_formatado+' · '+e.cidade+'/'+e.uf;li.appendChild(s);
        li.addEventListener('click',function(){porCnpj(e.cnpj)});lista.appendChild(li);
      });
    }).catch(function(){dizer('Sem conexão com o servidor.','erro')});
  }
  $('buscar').addEventListener('click',buscar);
  var inicial=new URLSearchParams(location.search).get('q');if(inicial){$('q').value=inicial;buscar()}
  $('q').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();buscar()}});
  f.addEventListener('reset',function(){dizer('');lista.textContent='';Array.prototype.forEach.call(f.querySelectorAll('.veio'),function(e){e.classList.remove('veio')})});
  f.addEventListener('submit',function(e){
    e.preventDefault();if(!$('razao').value.trim())return dizer('Preencha a razão social.','erro');
    var tr=document.createElement('tr');[$('fantasia').value||$('razao').value,$('cnpj').value,[$('cidade').value,$('uf').value].filter(Boolean).join('/')].forEach(function(t){var td=document.createElement('td');td.textContent=t;tr.appendChild(td)});
    $('clientes').prepend(tr);f.reset();$('q').value='';dizer('Cliente salvo nesta sessão.','ok');
  });
})();
</script>
</body>
</html>
